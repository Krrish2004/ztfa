[project]
name = "ztfa-client"
version = "0.1.0"
description = "ZTFA client node: local trainer + CKKS engine + wallet + inference"
requires-python = ">=3.11"
authors = [{ name = "ZTFA Contributors" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "paho-mqtt>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "web3>=7.4.0",
    "structlog>=24.4.0",
    "tenseal>=0.3.14",
    "poseidon-hash>=0.1.4",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[project.scripts]
ztfa-client = "ztfa_client.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
