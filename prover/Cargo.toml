[package]
name = "ztfa-prover"
version = "0.1.0"
edition = "2021"
description = "ZTFA Groth16 prover wrapper around snarkjs (v1) — slot for rapidsnark in v2"

[[bin]]
name = "ztfa-prove"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
