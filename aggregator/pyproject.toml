[project]
name = "ztfa-aggregator"
version = "0.1.0"
description = "ZTFA federated aggregator: homomorphic FedAvg + Groth16 prover"
requires-python = ">=3.11"
authors = [{ name = "ZTFA Contributors" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.3",
    "aiosqlite>=0.20.0",
    "boto3>=1.35.0",
    "web3>=7.4.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    # CKKS via TenSEAL (Microsoft SEAL wrapper) — pip-installable, HLD §11 alternative.
    # OpenFHE-python is the HLD-preferred lib but requires building OpenFHE C++ from source;
    # TenSEAL gives identical CKKS semantics for our depth-1 FedAvg use case.
    "tenseal>=0.3.14",
    # Poseidon (BN254-compatible)
    "poseidon-hash>=0.1.4",
    # Numerical (numpy floor lowered to 1.21 — transitive galois pin <1.27)
    "numpy>=1.21,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
    "types-requests",
]

[project.scripts]
ztfa-aggregator = "ztfa_aggregator.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
