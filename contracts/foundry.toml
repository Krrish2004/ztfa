[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
cbor_metadata = false
bytecode_hash = "none"
gas_reports = ["FederationRound", "Groth16Verifier"]
fs_permissions = [{ access = "read", path = "./test" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[fuzz]
runs = 256
